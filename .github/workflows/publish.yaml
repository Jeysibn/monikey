name: Publish images

# Runs on every push to `main` — i.e. right after a dev→main PR merges.
# validate.yaml is the quality gate (it already ran on `dev` and on the PR
# itself), so this workflow does no re-validation: it just figures out
# which package(s) changed in the merge and builds+pushes only those
# image(s). Images are tagged with the commit SHA so the homelab-gitops
# Argo Application can pin an exact, immutable digest-equivalent tag rather
# than tracking a mutable `latest`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which image(s) to build and push'
        type: choice
        options: [both, backend, frontend]
        default: both

permissions:
  contents: read
  packages: write

# Never cancel a publish mid-push — an interrupted docker push can leave a
# half-uploaded manifest/tag in GHCR. Two merges to main close together
# queue instead of racing or clobbering each other's `:latest`.
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # For a push event, dorny/paths-filter diffs against github.event.before —
  # the SHA main pointed to right before this push — so a squash- or
  # merge-commit's full net diff from the PR is captured correctly. A
  # manual (workflow_dispatch) run has no "before" commit to diff against,
  # so it skips the filter entirely and instead builds whichever image(s)
  # the `target` input picked — the obvious thing to want from a manual
  # run is "publish this on demand," not "figure out what changed."
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.final.outputs.backend }}
      frontend: ${{ steps.final.outputs.frontend }}
      # github.repository_owner preserves account casing ("Jeysibn"), but
      # GHCR (like every OCI registry) requires an all-lowercase repository
      # name — `docker/build-push-action` fails at tag-validation, before
      # it ever builds a layer, if this isn't lowercased first. Computed
      # once here and reused by both publish jobs below.
      image_owner: ${{ steps.owner.outputs.lowercase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Resolve final backend/frontend targets
        id: final
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ github.event.inputs.target }}"
            backend=$([ "$target" = both ] || [ "$target" = backend ] && echo true || echo false)
            frontend=$([ "$target" = both ] || [ "$target" = frontend ] && echo true || echo false)
          else
            backend="${{ steps.filter.outputs.backend }}"
            frontend="${{ steps.filter.outputs.frontend }}"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository owner for GHCR
        id: owner
        run: echo "lowercase=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

  publish-backend:
    name: Build & push api/worker image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ghcr.io/${{ needs.detect-changes.outputs.image_owner }}/monikey-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api/worker image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Record immutable image digest
        run: echo "API_IMAGE=${{ env.API_IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pushed image is pullable
        run: |
          set -euo pipefail
          docker pull "${{ env.API_IMAGE }}:${{ github.sha }}"
          docker inspect "${{ env.API_IMAGE }}:${{ github.sha }}" \
            --format 'Pulled {{.RepoTags}} ({{.Id}})'

      - name: Vulnerability scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "${{ env.API_IMAGE }}:${{ github.sha }}"

      - name: Generate SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 "${{ env.API_IMAGE }}:${{ github.sha }}" -o spdx-json > api-sbom.spdx.json

      - name: Deployment summary
        if: success()
        run: |
          echo "## Backend Image Published ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${{ env.API_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pulled back from GHCR and verified. Argo CD (homelab-gitops) will roll this tag out on its next sync." >> "$GITHUB_STEP_SUMMARY"

  publish-frontend:
    name: Build & push web image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      WEB_IMAGE: ghcr.io/${{ needs.detect-changes.outputs.image_owner }}/monikey-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_FINANCE_BACKEND=true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Record immutable image digest
        run: echo "WEB_IMAGE=${{ env.WEB_IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pushed image is pullable
        run: |
          set -euo pipefail
          docker pull "${{ env.WEB_IMAGE }}:${{ github.sha }}"
          docker inspect "${{ env.WEB_IMAGE }}:${{ github.sha }}" \
            --format 'Pulled {{.RepoTags}} ({{.Id}})'

      - name: Vulnerability scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "${{ env.WEB_IMAGE }}:${{ github.sha }}"

      - name: Generate SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.18.1 "${{ env.WEB_IMAGE }}:${{ github.sha }}" -o spdx-json > web-sbom.spdx.json

      - name: Deployment summary
        if: success()
        run: |
          echo "## Frontend Image Published ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${{ env.WEB_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pulled back from GHCR and verified. Argo CD (homelab-gitops) will roll this tag out on its next sync." >> "$GITHUB_STEP_SUMMARY"
