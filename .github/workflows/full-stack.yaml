name: Full-stack verification

# Deliberate production-like verification. The fast Validate workflow remains
# the PR feedback gate; this tier proves the shipped Compose topology and the
# backend-mode browser contract together.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose + backend-mode journeys
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # The disposable stack is reached over HTTP localhost, so use the
      # backend's test environment. compose.yaml defaults to production for
      # every normal deployment and local invocation.
      COMPOSE_NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare deterministic CI environment
        run: |
          cp .env.example .env
          sed -i 's/^VITE_FINANCE_BACKEND=.*/VITE_FINANCE_BACKEND=true/' .env
          sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start disposable production-like stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820028 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install test dependencies
        run: |
          npm ci --prefix frontend --include=dev
          npm ci --prefix backend --include=dev

      - name: Seed deterministic system reference data
        run: docker compose run --rm --no-deps migrate npm run db:seed:system

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Backend PostgreSQL regression suite
        run: npm run test:backend:compose

      - name: Backend-mode browser journeys
        # Registration-heavy journeys share the disposable runner's source IP
        # and must be serial so the real rate limiter is not mistaken for a
        # browser regression.
        run: npm run test:e2e:backend -- --workers=1

      - name: Shared finance contract against Compose API
        run: npm run test:e2e:contract

      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-stack-compose-diagnostics
          path: |
            compose-logs.txt
            frontend/test-results/
          if-no-files-found: ignore

      - name: Tear down disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
