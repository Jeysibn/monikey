name: Validate

# The required pre-merge gate. Keep this deliberately small: full-stack Compose
# checks remain available locally, while ordinary dev pushes and main PRs get
# prompt, repeatable feedback from the application packages themselves.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --include=dev
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm run test
        env:
          NODE_ENV: test
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:mock

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monikey
          POSTGRES_USER: monikey
          POSTGRES_PASSWORD: test-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://monikey:test-password@localhost:5432/monikey
      NODE_ENV: test
      APP_ORIGIN: http://localhost:8080
      API_PORT: 3000
      INTEGRATIONS_MODE: stub
      SESSION_SECURE: false
      SESSION_TTL_DAYS: 30
      LOG_LEVEL: info
      FX_PROVIDER: stub
      EQUITY_PROVIDER: stub
      CRYPTO_PROVIDER: stub
      OCR_PROVIDER: stub
      AI_PROVIDER: stub
      EMAIL_PROVIDER: stub
      BANK_PROVIDER: stub
      OBJECT_STORE: filesystem
      RECEIPT_STORAGE_PATH: /tmp/receipts
      ALLOW_TEST_CLOCK: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --include=dev
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: OpenAPI drift check
        working-directory: backend
        run: npm run api:openapi:check
      - name: Generate Prisma client and migrate
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Tests
        working-directory: backend
        run: npm run test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Pin security tooling to an immutable commit; update deliberately.
      - uses: trufflesecurity/trufflehog@4b7d1d3a6827691637eff750b6482042e06462d0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
