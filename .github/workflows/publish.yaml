name: Publish images

# Runs on every push to `main` — i.e. right after a dev→main PR merges.
# validate.yaml is the quality gate (it already ran on `dev` and on the PR
# itself), so this workflow does no re-validation: it just figures out
# which package(s) changed in the merge and builds+pushes only those
# image(s). Images are tagged with the commit SHA so the homelab-gitops
# Argo Application can pin an exact, immutable digest-equivalent tag rather
# than tracking a mutable `latest`.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Never cancel a publish mid-push — an interrupted docker push can leave a
# half-uploaded manifest/tag in GHCR. Two merges to main close together
# queue instead of racing or clobbering each other's `:latest`.
concurrency:
  group: publish-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # For a push event, dorny/paths-filter diffs against github.event.before —
  # the SHA main pointed to right before this push — so a squash- or
  # merge-commit's full net diff from the PR is captured correctly.
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      # github.repository_owner preserves account casing ("Jeysibn"), but
      # GHCR (like every OCI registry) requires an all-lowercase repository
      # name — `docker/build-push-action` fails at tag-validation, before
      # it ever builds a layer, if this isn't lowercased first. Computed
      # once here and reused by both publish jobs below.
      image_owner: ${{ steps.owner.outputs.lowercase }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Lowercase repository owner for GHCR
        id: owner
        run: echo "lowercase=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

  publish-backend:
    name: Build & push api/worker image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ghcr.io/${{ needs.detect-changes.outputs.image_owner }}/monikey-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api/worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify pushed image is pullable
        run: |
          set -euo pipefail
          docker pull "${{ env.API_IMAGE }}:${{ github.sha }}"
          docker inspect "${{ env.API_IMAGE }}:${{ github.sha }}" \
            --format 'Pulled {{.RepoTags}} ({{.Id}})'

      - name: Deployment summary
        if: success()
        run: |
          echo "## Backend Image Published ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${{ env.API_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pulled back from GHCR and verified. Argo CD (homelab-gitops) will roll this tag out on its next sync." >> "$GITHUB_STEP_SUMMARY"

  publish-frontend:
    name: Build & push web image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      WEB_IMAGE: ghcr.io/${{ needs.detect-changes.outputs.image_owner }}/monikey-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_FINANCE_BACKEND=true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify pushed image is pullable
        run: |
          set -euo pipefail
          docker pull "${{ env.WEB_IMAGE }}:${{ github.sha }}"
          docker inspect "${{ env.WEB_IMAGE }}:${{ github.sha }}" \
            --format 'Pulled {{.RepoTags}} ({{.Id}})'

      - name: Deployment summary
        if: success()
        run: |
          echo "## Frontend Image Published ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${{ env.WEB_IMAGE }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pulled back from GHCR and verified. Argo CD (homelab-gitops) will roll this tag out on its next sync." >> "$GITHUB_STEP_SUMMARY"
