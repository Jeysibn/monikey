name: CI

on:
  push:
    branches: [main, feature/backend-implementation, develop]
  pull_request:
    branches: [main, feature/backend-implementation, develop]

env:
  POSTGRES_DB: monikey
  POSTGRES_USER: monikey
  POSTGRES_PASSWORD: test-password
  DATABASE_URL: postgresql://monikey:test-password@localhost:5432/monikey
  NODE_ENV: production
  APP_ORIGIN: http://localhost:8080
  API_PORT: 3000
  INTEGRATIONS_MODE: stub
  SESSION_SECURE: false
  SESSION_TTL_DAYS: 30
  LOG_LEVEL: info
  FX_PROVIDER: stub
  EQUITY_PROVIDER: stub
  CRYPTO_PROVIDER: stub
  OCR_PROVIDER: stub
  AI_PROVIDER: stub
  EMAIL_PROVIDER: stub
  BANK_PROVIDER: stub
  OBJECT_STORE: filesystem
  RECEIPT_STORAGE_PATH: /tmp/receipts
  ALLOW_TEST_CLOCK: true

jobs:
  frontend-lint-typecheck-build:
    name: Frontend Lint, Typecheck, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test
        env:
          # Overrides the job-level NODE_ENV=production (kept elsewhere so
          # build/integration steps exercise real production behavior) —
          # Vitest/Testing Library's React.act helper is stripped from
          # React's production build, so under NODE_ENV=production it
          # doesn't exist and every test using it throws "React.act is not
          # a function".
          NODE_ENV: test

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

  backend-tests:
    name: Backend Tests with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --include=dev

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --include=dev

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Typecheck backend
        working-directory: ./backend
        run: npm run typecheck

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Prisma migration from empty DB
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run backend unit tests
        working-directory: ./backend
        run: npm run test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  backend-integration-tests:
    name: Backend Integration Tests with Live DB
    runs-on: ubuntu-latest
    needs: backend-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --include=dev

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci --include=dev

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Prisma migration for integration tests
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run integration tests
        working-directory: ./backend
        run: npm run test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  docker-build-and-scan:
    name: Docker Build and Scan with Trivy
    runs-on: ubuntu-latest
    needs: backend-tests
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: monikey-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Web.Dockerfile
          push: false
          load: true
          tags: monikey-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Trivy output directory
        run: mkdir -p trivy-results

      - name: Run Trivy vulnerability scan - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: monikey-backend:latest
          format: 'sarif'
          output: 'trivy-results/trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scan - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: monikey-web:latest
          format: 'sarif'
          output: 'trivy-results/trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      # Uploading the whole trivy-results/ directory in one step (both
      # files sharing category: 'trivy') hit "The CodeQL Action does not
      # support uploading multiple SARIF runs with the same category" —
      # each file needs its own upload step with a distinct category.
      - name: Upload backend Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results/trivy-backend.sarif'
          category: 'trivy-backend'

      - name: Upload frontend Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results/trivy-frontend.sarif'
          category: 'trivy-frontend'

  security-checks:
    name: Security Checks (Secrets, Dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run secret scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Check for VITE_ env vars in source
        run: |
          echo "Checking for sensitive VITE_ env vars in source code..."
          if grep -r "VITE_.*KEY\|VITE_.*SECRET\|VITE_.*PASSWORD\|VITE_.*TOKEN" src --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
            echo "ERROR: Found sensitive environment variables with VITE_ prefix"
            exit 1
          fi
          echo "No sensitive VITE_ env vars found"

      - name: Verify .env and .env.local are gitignored
        run: |
          echo "Checking .gitignore for .env files..."
          if grep -E "^\.env$|^\.env\.local$|^\.env\.\*\.local$" .gitignore; then
            echo ".env files are properly gitignored"
          else
            echo "WARNING: .env files might not be properly gitignored"
            cat .gitignore | grep env
          fi

      - name: Check for committed secrets
        run: |
          echo "Checking for common secret patterns..."
          if grep -r "DATABASE_URL.*password\|API_KEY.*=.*[a-zA-Z0-9]\{20,\}\|SECRET.*=.*[a-zA-Z0-9]\{20,\}" . \
            --include="*.yaml" --include="*.yml" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist; then
            echo "WARNING: Found potential secrets in configuration files"
          fi
          echo "Secret check complete"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        frontend-lint-typecheck-build,
        backend-tests,
        backend-integration-tests,
        docker-build-and-scan,
        security-checks,
      ]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.frontend-lint-typecheck-build.result }}" != "success" ]; then
            echo "Frontend checks failed"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-integration-tests.result }}" != "success" ]; then
            echo "Backend integration tests failed"
            exit 1
          fi
          if [ "${{ needs.docker-build-and-scan.result }}" != "success" ]; then
            echo "Docker build/scan failed"
            exit 1
          fi
          if [ "${{ needs.security-checks.result }}" != "success" ]; then
            echo "Security checks failed"
            exit 1
          fi
          echo "All CI checks passed!"
