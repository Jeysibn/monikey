name: CI

on:
  push:
    branches: [main, feature/backend-implementation, develop]
  pull_request:
    branches: [main, feature/backend-implementation, develop]

env:
  DATABASE_URL: postgresql://monikey:test-password@localhost:5432/monikey
  NODE_ENV: production
  APP_ORIGIN: http://localhost:8080
  API_PORT: 3000
  INTEGRATIONS_MODE: stub
  SESSION_SECURE: false
  SESSION_TTL_DAYS: 30
  LOG_LEVEL: info
  FX_PROVIDER: stub
  EQUITY_PROVIDER: stub
  CRYPTO_PROVIDER: stub
  OCR_PROVIDER: stub
  AI_PROVIDER: stub
  EMAIL_PROVIDER: stub
  BANK_PROVIDER: stub
  OBJECT_STORE: filesystem
  RECEIPT_STORAGE_PATH: /tmp/receipts
  ALLOW_TEST_CLOCK: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck
      # NODE_ENV=production (job-level) strips React.act, which
      # Testing Library/Vitest need — override to `test` for this step only.
      - run: npm run test
        env:
          NODE_ENV: test
      - run: npm run build

  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monikey
          POSTGRES_USER: monikey
          POSTGRES_PASSWORD: test-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - working-directory: ./backend
        run: npm ci --include=dev

      - working-directory: ./backend
        run: npm run lint

      - working-directory: ./backend
        run: npm run typecheck

      - working-directory: ./backend
        run: npx prisma migrate deploy

      - working-directory: ./backend
        run: npm run test
