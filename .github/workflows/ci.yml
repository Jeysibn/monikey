name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Check database and API
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
          bash database/test.sh
          bash backend/test.sh

      - name: Validate container builds
        run: |
          docker build --tag monikey-frontend:ci --build-arg VITE_DATA_SOURCE=http frontend
          docker build --tag monikey-api:ci backend

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish SHA-tagged images
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          owner="${IMAGE_OWNER,,}"
          docker build --tag "ghcr.io/$owner/monikey-v2-frontend:sha-$IMAGE_SHA" --build-arg VITE_DATA_SOURCE=http frontend
          docker build --tag "ghcr.io/$owner/monikey-v2-api:sha-$IMAGE_SHA" backend
          docker push "ghcr.io/$owner/monikey-v2-frontend:sha-$IMAGE_SHA"
          docker push "ghcr.io/$owner/monikey-v2-api:sha-$IMAGE_SHA"
