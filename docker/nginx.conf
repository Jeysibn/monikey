server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers appropriate for local/dev profile. Declared at
    # server level with `always` so they apply to every response, including
    # error responses — nginx `add_header` does NOT inherit into a `location`
    # block that declares its own `add_header` (QA Attempt 1, Finding 8), so
    # every location below that needs them repeats them explicitly rather
    # than relying on inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS (127.0.0.11) resolves the `api` service name at
    # *request* time via the `$api_upstream` variable, rather than nginx
    # resolving it once at config-load time. Plain `proxy_pass http://api:...`
    # fails config parsing entirely — and kills the whole SPA container with
    # it — the moment `api` is unresolvable (QA Attempt 1, Finding 7: e.g.
    # `docker run monikey-web` standalone, or `api` recreated after `web`).
    # With the resolver+variable form, nginx starts regardless, and only
    # `/api/*`/`/openapi.json`/`/docs` requests fail (502) while `api` is
    # actually absent — the SPA itself stays up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `^~` stops nginx from falling through to a regex `location` (like the
    # static-asset extension matcher below) for anything under this prefix.
    # Without it, ordinary prefix locations lose to ANY regex location
    # regardless of prefix length — so `/api/v1/foo.png` was matching the
    # `~* \.(?:js|css|...)$` block below and getting nginx's own bare HTML
    # 404 instead of ever reaching the API (QA Attempt 2, Finding D6).
    location ^~ /api/ {
        set $api_upstream http://api:3000;
        # No path after $api_upstream: with a variable in proxy_pass, nginx
        # cannot do its usual "replace the matched location prefix" rewrite,
        # so any literal path written here (e.g. `$api_upstream/api/`) gets
        # appended IN ADDITION to the full original request URI rather than
        # replacing anything — `/api/v1/health/ready` became the doubled,
        # 404-ing `/api//api/v1/health/ready` upstream request until this was
        # caught by re-verifying this exact endpoint after the Finding 7 fix.
        # Passing no URI here makes nginx forward the original request URI
        # unmodified, which is already `/api/v1/...` and needs no rewriting.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Local/dev-profile only (per plan §8.15: "open access is acceptable
    # only in local development if explicitly configured") — reachable at
    # the same :8080 origin the docs describe, rather than falling through
    # to a 200 text/html SPA response (QA Attempt 1, Finding 11). A future
    # public deployment must remove or auth-gate these two locations.
    location = /openapi.json {
        set $api_upstream http://api:3000;
        # See the /api/ location's comment above: no path after
        # $api_upstream, so nginx forwards the original request URI
        # unmodified (which for this exact-match location is always
        # literally `/openapi.json` already).
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Same `^~` reasoning as `/api/` above — Swagger UI serves its own JS/CSS
    # assets under `/docs/...`, which would otherwise be caught by the
    # static-asset regex location instead of reaching the API.
    location ^~ /docs {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback: any non-file, non-/api route serves index.html so
    # client-side routing (react-router-dom) resolves deep links correctly.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # A single Cache-Control header (not one from `expires` plus a second
        # explicit one — QA Attempt 1, Finding 8 caught both being emitted).
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }
}
